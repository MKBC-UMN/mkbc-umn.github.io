- title: "Fall 2026 Schedule"
  items:
    - "**Time:** Every other Saturday, 11:00 AM-1:00 PM."
    - "**September:** Sunday, September 13; Saturday, September 26."
    - "**October:** Saturday, October 10; Saturday, October 24."
    - "**November:** Saturday, November 7; Saturday, November 21."
    - "**December:** Saturday, December 5; Saturday, December 12."
    - "**Location:** Cooke Hall 325."
    - "Schedule changes will be shared through the group chat."
- title: "How We Play"
  items:
    - "MKBC reserves courts for **two hours every other week** to provide consistent playing time."
    - "On weeks without a reserved court, members may organize informal free-play sessions."
- title: "Trial Sessions"
  items:
    - "New members may attend up to **two trial sessions for free**."
    - "After the trial period, players should complete the membership process to continue regular participation."
- title: "Equipment"
  items:
    - "Players are encouraged to bring their own racket."
    - "Members who do not have a racket may rent one from **RecWell**."
    - "Shuttlecocks and shared supplies are supported through club fees."
- title: "Membership Fee"
  items:
    - "Membership fees support court reservations, insurance, shuttlecocks, and club operations."
    - "**First month:** $35."
    - "**Monthly dues after the first month:** $15."
